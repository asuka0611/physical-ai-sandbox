[project]
name = "physical-ai-sandbox"
version = "0.1.0"
description = "Phase 1 manual-control MuJoCo sandbox for Physical AI experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
physical-ai-validate-config = "physical_ai_sandbox.cli.validate_config:main"
physical-ai-replay = "physical_ai_sandbox.cli.replay_episode:main"
physical-ai-bc-rollout = "physical_ai_sandbox.cli.evaluate_bc_rollout:main"
physical-ai-collect-grasp-lift = "physical_ai_sandbox.cli.grasp_lift_demo:main"
physical-ai-compare-ppo = "physical_ai_sandbox.cli.compare_ppo:main"
physical-ai-evaluate-ppo = "physical_ai_sandbox.cli.evaluate_ppo:main"
physical-ai-train-ppo = "physical_ai_sandbox.cli.train_ppo:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
